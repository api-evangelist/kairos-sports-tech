name: Kairos Sports Tech
description: >-
  Kairos Sports Tech was a Belfast and Dublin based sports technology startup
  that built a team operations and communication platform for professional
  sports, integrating team planning, daily communication, and player management
  into one centralized system used by more than 100 football and rugby
  organizations. Founded by Andrew Trimble and Gareth Quinn and backed by
  Techstars, Kairos was acquired by Teamworks in January 2024 and its product was
  folded into the Teamworks Hub athlete operating system. The standalone
  kairostech.io site now redirects entirely to teamworks.com/hub/, and Kairos no
  longer operates an independent public API, developer program, or discoverable
  API artifacts.
